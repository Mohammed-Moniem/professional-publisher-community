name: Verify and package
on:
  push:
  pull_request:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: FFmpeg on Windows
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - run: npm audit --audit-level=low
      - run: npm test
      - run: node scripts/public-check.mjs
      - run: npm run release:pack
      - name: Sign build provenance for public main builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.tar.gz
            release/*.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: publisher-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.tar.gz
            release/*.mcpb
            release/*.sha256
          retention-days: 14
